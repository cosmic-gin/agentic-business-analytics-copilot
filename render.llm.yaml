services:
  - type: web
    name: delivery-analytics-copilot-llm
    runtime: docker
    plan: free
    autoDeployTrigger: "off"
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: APP_MODE
        value: llm
      - key: APP_REQUIRE_ACCESS_PASSWORD
        value: "true"
      - key: APP_ACCESS_PASSWORD
        generateValue: true
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: GROQ_API_KEY
        sync: false
